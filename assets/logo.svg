<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" role="img" aria-label="Omni">
  <style>
    .frame {
      fill: none;
      stroke: #0a0a0a;
      stroke-width: 2;
    }
    .dot,
    .type {
      fill: #0a0a0a;
    }
    @media (prefers-color-scheme: dark) {
      .frame {
        stroke: #fafafa;
      }
      .dot,
      .type {
        fill: #fafafa;
      }
    }
  </style>
  <rect class="frame" x="0" y="4" width="24" height="24" />
  <circle class="dot" cx="12" cy="16" r="4" />
  <text class="type" x="34" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Omni</text>
</svg>
